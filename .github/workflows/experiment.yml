# Run Experiment — MANUAL, long-running research job.
#
# This is a manually triggered (workflow_dispatch only) research run, NOT a CI gate.
# A full sweep (e.g. h011b_collab across many seeds) is a long research computation
# that can legitimately exceed GitHub's hosted-runner time limit. A cancelled or
# incomplete run here is EXPECTED — it is NOT a CI failure and NOT a repo defect.
#
# This workflow is intentionally excluded from the CI gate: it never runs unattended
# (no push/schedule triggers) and its result does not block merges or releases.
# Do not treat a timed-out run as something to "fix" by reducing the experiment's
# scope or parameters — that would alter the research.

name: Run Experiment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      hypothesis:
        description: "Hypothesis ID (e.g. h008c)"
        required: true
        type: string
      models:
        description: "Space-separated model names"
        required: true
        type: string
        default: "l1-hodge-residual hodge-mp-residual gin-residual mlp-baseline"
      datasets:
        description: "Space-separated dataset names"
        required: true
        type: string
        default: "collab"
      seeds:
        description: "Number of seeds (will use 0..n-1)"
        required: true
        type: number
        default: 18
      epochs:
        description: "Number of training epochs"
        required: true
        type: number
        default: 10
      extra_args:
        description: "Additional CLI flags (e.g. --constant-features)"
        required: false
        type: string
        default: ""

jobs:
  experiment:
    name: "${{ inputs.hypothesis }} (${{ inputs.datasets }}, ${{ inputs.seeds }} seeds)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + bench deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[bench]"

      - name: Cache TUDataset downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/topogeoml/benchmarks/hodge
          key: tudataset-${{ inputs.datasets }}-${{ runner.os }}

      - name: Generate seed list
        id: seeds
        run: |
          python -c "print(' '.join(str(i) for i in range(int(${{ inputs.seeds }}))))" > /tmp/seeds.txt
          echo "list=$(cat /tmp/seeds.txt)" >> "$GITHUB_OUTPUT"

      - name: Run experiment
        run: |
          python -m benchmarks.hodge \
            --datasets ${{ inputs.datasets }} \
            --models ${{ inputs.models }} \
            --seeds ${{ steps.seeds.outputs.list }} \
            --n-epochs $(python -c "print(int(${{ inputs.epochs }}))") \
            --output notebooks/results/${{ inputs.hypothesis }}_30seeds.json \
            --markdown notebooks/results/${{ inputs.hypothesis }}_30seeds.md \
            ${{ inputs.extra_args }}

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.hypothesis }}-results
          path: |
            notebooks/results/${{ inputs.hypothesis }}_30seeds.json
            notebooks/results/${{ inputs.hypothesis }}_30seeds.md
          retention-days: 90

      - name: Post summary
        run: cat notebooks/results/${{ inputs.hypothesis }}_30seeds.md >> "$GITHUB_STEP_SUMMARY"
