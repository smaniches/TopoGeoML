# Run Experiment — MANUAL, long-running research job.
#
# This is a manually triggered (workflow_dispatch only) research run, NOT a CI gate.
# A full sweep (e.g. h011b_collab across many seeds) is a long research computation
# that can legitimately exceed GitHub's hosted-runner time limit. A cancelled or
# incomplete run here is EXPECTED — it is NOT a CI failure and NOT a repo defect.
#
# This workflow is intentionally excluded from the CI gate: it never runs unattended
# (no push/schedule triggers) and its result does not block merges or releases.
# Do not treat a timed-out run as something to "fix" by reducing the experiment's
# scope or parameters — that would alter the research.

name: Run Experiment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      hypothesis:
        description: "Hypothesis ID (e.g. h008c)"
        required: true
        type: string
      models:
        description: "Space-separated model names"
        required: true
        type: string
        default: "l1-hodge-residual hodge-mp-residual gin-residual mlp-baseline"
      datasets:
        description: "Space-separated dataset names"
        required: true
        type: string
        default: "collab"
      seeds:
        description: "Number of seeds (will use 0..n-1)"
        required: true
        type: number
        default: 18
      epochs:
        description: "Number of training epochs"
        required: true
        type: number
        default: 10
      extra_args:
        description: "Additional CLI flags (e.g. --constant-features)"
        required: false
        type: string
        default: ""

jobs:
  experiment:
    name: "${{ inputs.hypothesis }} (${{ inputs.datasets }}, ${{ inputs.seeds }} seeds)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + bench deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[bench]"

      - name: Cache TUDataset downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/topogeoml/benchmarks/hodge
          key: tudataset-${{ inputs.datasets }}-${{ runner.os }}

      - name: Run experiment
        env:
          EXPERIMENT_HYPOTHESIS: ${{ inputs.hypothesis }}
          EXPERIMENT_MODELS: ${{ inputs.models }}
          EXPERIMENT_DATASETS: ${{ inputs.datasets }}
          EXPERIMENT_SEEDS: ${{ inputs.seeds }}
          EXPERIMENT_EPOCHS: ${{ inputs.epochs }}
          EXPERIMENT_EXTRA_ARGS: ${{ inputs.extra_args }}
        run: |
          python - <<'PY'
          import os
          import re
          import shlex
          import subprocess
          import sys
          from pathlib import Path

          hypothesis = os.environ["EXPERIMENT_HYPOTHESIS"]
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]*", hypothesis):
              raise SystemExit(
                  "hypothesis must contain only letters, digits, '.', '_' or '-'"
              )

          seed_count = int(os.environ["EXPERIMENT_SEEDS"])
          epochs = int(os.environ["EXPERIMENT_EPOCHS"])
          if seed_count < 1:
              raise SystemExit("seeds must be at least 1")
          if epochs < 1:
              raise SystemExit("epochs must be at least 1")

          datasets = shlex.split(os.environ["EXPERIMENT_DATASETS"])
          models = shlex.split(os.environ["EXPERIMENT_MODELS"])
          extra_args = shlex.split(os.environ.get("EXPERIMENT_EXTRA_ARGS", ""))
          if not datasets:
              raise SystemExit("at least one dataset is required")
          if not models:
              raise SystemExit("at least one model is required")

          managed_options = {
              "--datasets",
              "--models",
              "--seeds",
              "--n-epochs",
              "--output",
              "--markdown",
          }
          conflicting_options = sorted(
              {token.split("=", 1)[0] for token in extra_args} & managed_options
          )
          if conflicting_options:
              raise SystemExit(
                  "extra_args may not override workflow-managed options: "
                  + ", ".join(conflicting_options)
              )

          output_dir = Path("notebooks/results")
          output_dir.mkdir(parents=True, exist_ok=True)
          stem = f"{hypothesis}_{seed_count}seeds"

          command = [
              sys.executable,
              "-m",
              "benchmarks.hodge",
              *extra_args,
              "--datasets",
              *datasets,
              "--models",
              *models,
              "--seeds",
              *(str(seed) for seed in range(seed_count)),
              "--n-epochs",
              str(epochs),
              "--output",
              str(output_dir / f"{stem}.json"),
              "--markdown",
              str(output_dir / f"{stem}.md"),
          ]
          subprocess.run(command, check=True)
          PY

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.hypothesis }}-${{ inputs.seeds }}seeds-results
          path: |
            notebooks/results/${{ inputs.hypothesis }}_${{ inputs.seeds }}seeds.json
            notebooks/results/${{ inputs.hypothesis }}_${{ inputs.seeds }}seeds.md
          retention-days: 90

      - name: Post summary
        env:
          RESULT_STEM: ${{ inputs.hypothesis }}_${{ inputs.seeds }}seeds
        run: cat "notebooks/results/${RESULT_STEM}.md" >> "$GITHUB_STEP_SUMMARY"
