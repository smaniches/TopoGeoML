name: Run Experiment

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      hypothesis:
        description: "Hypothesis ID (e.g. h008c)"
        required: true
        type: string
      models:
        description: "Space-separated model names"
        required: true
        type: string
        default: "hodge-mp-residual mlp-baseline"
      datasets:
        description: "Space-separated dataset names"
        required: true
        type: string
        default: "nci1"
      seeds:
        description: "Number of seeds (will use 0..n-1)"
        required: true
        type: number
        default: 30
      epochs:
        description: "Number of training epochs"
        required: true
        type: number
        default: 10
      extra_args:
        description: "Additional CLI flags (e.g. --constant-features)"
        required: false
        type: string
        default: ""

jobs:
  experiment:
    name: "${{ inputs.hypothesis }} (${{ inputs.datasets }}, ${{ inputs.seeds }} seeds)"
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + bench deps
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[bench]"

      - name: Cache TUDataset downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/topogeoml/benchmarks/hodge
          key: tudataset-${{ inputs.datasets }}-${{ runner.os }}

      - name: Generate seed list
        id: seeds
        run: |
          python -c "print(' '.join(str(i) for i in range(${{ inputs.seeds }})))" > /tmp/seeds.txt
          echo "list=$(cat /tmp/seeds.txt)" >> "$GITHUB_OUTPUT"

      - name: Run experiment
        run: |
          python -m benchmarks.hodge \
            --datasets ${{ inputs.datasets }} \
            --models ${{ inputs.models }} \
            --seeds ${{ steps.seeds.outputs.list }} \
            --n-epochs ${{ inputs.epochs }} \
            --output notebooks/results/${{ inputs.hypothesis }}_30seeds.json \
            --markdown notebooks/results/${{ inputs.hypothesis }}_30seeds.md \
            ${{ inputs.extra_args }}

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.hypothesis }}-results
          path: |
            notebooks/results/${{ inputs.hypothesis }}_30seeds.json
            notebooks/results/${{ inputs.hypothesis }}_30seeds.md
          retention-days: 90

      - name: Post summary
        run: cat notebooks/results/${{ inputs.hypothesis }}_30seeds.md >> "$GITHUB_STEP_SUMMARY"
