name: one-shot-cleanup-finalize

on:
  push:
    branches: [cleanup/zero-known-tech-debt-20260818]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cleanup/zero-known-tech-debt-20260818
          fetch-depth: 0

      - name: apply warning and statistical-language fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing replacement anchor in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          replace(
              'tests/test_hodge_bench.py',
              '''        dummy_L = torch.sparse_coo_tensor(\n            indices=torch.zeros(2, 0, dtype=torch.long),\n            values=torch.zeros(0, dtype=torch.float64),\n            size=(5, 5),\n        )''',
              '''        with torch.sparse.check_sparse_tensor_invariants(False):\n            dummy_L = torch.sparse_coo_tensor(\n                indices=torch.zeros(2, 0, dtype=torch.long),\n                values=torch.zeros(0, dtype=torch.float64),\n                size=(5, 5),\n            )''',
          )

          # H001: only resolved/current interpretation. Preregistered protocol text is untouched.
          replace('docs/hypotheses/HYPOTHESIS-001-hodge-mutag.md', '| **H1**: symm L̃ | **0.789 [0.763, 0.816]** | **0.714** | **matches MLP** |', '| **H1**: symm L̃ | **0.789 [0.763, 0.816]** | **0.714** | **no detected difference** |')
          replace('docs/hypotheses/HYPOTHESIS-001-hodge-mutag.md', '| **H3**: H2 + 2 stacked layers | 0.776 [0.737, 0.789] | 0.102 | matches (weak) |', '| **H3**: H2 + 2 stacked layers | 0.776 [0.737, 0.789] | 0.102 | no detected difference |')
          replace('docs/hypotheses/HYPOTHESIS-001-hodge-mutag.md', '**H1 → MLP equivalence — *confirmed*.** `hodge-mp-normalised` vs `mlp-baseline` has median Δ = +0.000, p_BH = 0.714. The normalised Hodge architecture is **statistically indistinguishable from the MLP baseline** on MUTAG at 30 seeds. The strong claim of hypothesis 001 holds.', '**H1 → MLP difference — *not detected under the registered test*.** `hodge-mp-normalised` vs `mlp-baseline` has median Δ = +0.000, p_BH = 0.714. At this 30-seed design the paired test does not detect a difference. This is a non-rejection result, not evidence of equivalence; no equivalence margin or equivalence test was pre-specified.')
          replace('docs/hypotheses/HYPOTHESIS-001-hodge-mutag.md', 'achieves accuracy statistically indistinguishable from a no-topology MLP of matched capacity (paired Wilcoxon p_BH = 0.714, median Δ = +0.000, BCa 95% CI on Hodge accuracy: [0.763, 0.816]).', 'has the same observed median accuracy as a no-topology MLP of matched capacity (median Δ = +0.000), with no difference detected by the paired Wilcoxon comparison after BH correction (p_BH = 0.714; BCa 95% CI on Hodge accuracy: [0.763, 0.816]). This does not establish statistical equivalence.')
          replace('docs/hypotheses/HYPOTHESIS-001-hodge-mutag.md', 'This is a **positive equality claim** (matches the literature\'s nuance: topology doesn\'t *beat* MLP on MUTAG but a properly-normalised topology architecture is competitive).', 'This is a **competitive-performance / no-detected-difference claim**, not an equivalence claim (topology does not *beat* MLP on MUTAG; the registered test also does not detect a difference for the normalised arm).')

          # H002: resolved/current interpretation only; preregistered outcome tree remains historical protocol.
          for old, new in [
              ('| `hodge-mp-classifier` (combinatorial L) | 0.646 [0.605, 0.700] | 0.646 | matches MLP |', '| `hodge-mp-classifier` (combinatorial L) | 0.646 [0.605, 0.700] | 0.646 | no detected difference |'),
              ('| `hodge-mp-normalised` (H1) | 0.688 [0.670, 0.704] | 0.548 | matches MLP |', '| `hodge-mp-normalised` (H1) | 0.688 [0.670, 0.704] | 0.548 | no detected difference |'),
              ('| `hodge-mp-residual` (H2) | 0.686 [0.670, 0.717] | 0.339 | matches MLP |', '| `hodge-mp-residual` (H2) | 0.686 [0.670, 0.717] | 0.339 | no detected difference |'),
              ('| `hodge-mp-deep-residual` (H3) | 0.695 [0.659, 0.709] | 0.426 | matches MLP |', '| `hodge-mp-deep-residual` (H3) | 0.695 [0.659, 0.709] | 0.426 | no detected difference |'),
              ('The symm-normalised arm reaches the same accuracy as MLP, replicating the MUTAG equality finding across a second dataset.', 'The symm-normalised arm has median Δ = +0.0135 with no detected difference from MLP under the registered paired test. This replicates a non-rejection pattern from MUTAG but does not establish equality or equivalence.'),
              ('The symmetrically-normalised one-layer Hodge MP **matches** an MLP baseline of matched capacity on both MUTAG (p_BH = 0.714) and PROTEINS (p_BH = 0.548).', 'For the symmetrically-normalised one-layer Hodge MP, the registered paired tests detect no difference from the matched-capacity MLP on MUTAG (p_BH = 0.714) or PROTEINS (p_BH = 0.548). These are non-rejections, not equivalence tests.'),
              ('The symm-normalised arm matches MLP with median Δ = +0.0135 (p_BH = 0.548), replicating the cross-dataset equality finding from MUTAG (p_BH = 0.714).', 'The symm-normalised arm has median Δ = +0.0135 and no detected difference from MLP (p_BH = 0.548), replicating the MUTAG non-rejection pattern (p_BH = 0.714) without establishing equivalence.'),
              ('This is a **two-dataset equality claim**. It is a defensible Geo-subsystem result; it is *not* a "topology helps" claim.', 'This is a **two-dataset no-detected-difference pattern**, not an equality or equivalence claim. It is *not* a "topology helps" claim.'),
          ]:
              replace('docs/hypotheses/HYPOTHESIS-002-hodge-proteins.md', old, new)

          # H003: resolved/current interpretation only.
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', '| symm L̃ (H1) | 0.516 [0.511, 0.523] | 0.253 | matches MLP |', '| symm L̃ (H1) | 0.516 [0.511, 0.523] | 0.253 | no detected difference |')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', '**H9 (H1 ≥ MLP): CONFIRMED across THREE datasets.** Median Δ = -0.007, p_BH = 0.253. The symm-normalised arm matches MLP on MUTAG (p_BH = 0.714), PROTEINS (p_BH = 0.548), and NCI1 (p_BH = 0.253). Plain normalisation alone is robustly *equivalent* to MLP across the small-medium-large dataset spectrum.', '**H9 (H1 ≥ MLP under the preregistered decision rule): criterion met across THREE datasets.** On NCI1, median Δ = -0.007 and p_BH = 0.253; the paired tests likewise did not detect a difference on MUTAG (p_BH = 0.714) or PROTEINS (p_BH = 0.548). This repeated non-rejection does not establish statistical equivalence across datasets because no equivalence margin or equivalence test was pre-specified.')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', 'the two are statistically indistinguishable from each other (median Δ = +0.007, p_BH = 0.614).', 'the paired comparison detects no difference between them (median Δ = +0.007, p_BH = 0.614); this is not an equivalence result.')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', 'and **matched** MLP on PROTEINS (p_BH = 0.339), then **wins** on NCI1', 'and had no detected difference from MLP on PROTEINS (p_BH = 0.339), then **wins** on NCI1')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', 'The same residual variant matches MLP on PROTEINS (1113 graphs, p_BH = 0.339)', 'The same residual variant has no detected difference from MLP on PROTEINS (1113 graphs, p_BH = 0.339)')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', '| combinatorial L | LOSES (p=5.66e-4, -9pp) | matches | LOSES (p=2.6e-4, -1.7pp) |', '| combinatorial L | LOSES (p=5.66e-4, -9pp) | no detected difference | LOSES (p=2.6e-4, -1.7pp) |')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', '| symm L̃ | matches | matches | matches |', '| symm L̃ | no detected difference | no detected difference | no detected difference |')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', '| symm L̃ + residual | LOSES (p=0.019, -4pp) | matches | **WINS (p=4.83e-3, +8.6pp)** |', '| symm L̃ + residual | LOSES (p=0.019, -4pp) | no detected difference | **WINS (p=4.83e-3, +8.6pp)** |')
          replace('docs/hypotheses/HYPOTHESIS-003-hodge-nci1.md', '| symm L̃ + 2L + residual | matches | matches | **WINS (p=0.012, +8pp)** |', '| symm L̃ + 2L + residual | no detected difference | no detected difference | **WINS (p=0.012, +8pp)** |')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = '### Fixed\n\n'
          addition = ('- **Torch 2.13 warning-as-error regression in the Hodge bench test.** The MLP forward smoke test now constructs its unused empty sparse COO Laplacian under `torch.sparse.check_sparse_tensor_invariants(False)`, matching the library-side explicit sparse policy and preserving the repository-wide warnings-as-errors gate. Current-facing H001-H003 result sections are also calibrated so non-significant paired tests are described as no detected difference at the tested power rather than as equality/equivalence; preregistered decision-tree text is preserved as historical protocol.\n\n')
          if addition not in text:
              if anchor not in text:
                  raise SystemExit('CHANGELOG Fixed anchor missing')
              changelog.write_text(text.replace(anchor, anchor + addition, 1), encoding='utf-8', newline='\n')

      - name: remove one-shot workflow
        run: git rm .github/workflows/_cleanup_finalize.yml

      - name: commit finalized cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close warning regression and calibrate null-result language'
          git push origin HEAD:cleanup/zero-known-tech-debt-20260818
