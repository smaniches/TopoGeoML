name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          # CPU torch is installed FIRST so the mypy step (which strict-
          # checks ``topogeoml/nn/{hodge,diff_ph,cubical_diff_ph}.py``)
          # can resolve ``torch.Tensor`` references. Without torch the
          # type checker treats ``cast(torch.Tensor, ...)`` as
          # ``cast(<unresolved>, ...)`` and the step fails with
          # ``Name "torch.Tensor" is not defined`` (or similar) even
          # though ``ignore_missing_imports = true`` is set — the
          # ``cast`` argument needs the symbol to be statically
          # resolvable, and ``ignore_missing_imports`` only relaxes
          # *imports*, not name resolution.
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check topogeoml tests benchmarks notebooks scripts

      - name: Type-check with mypy
        run: mypy topogeoml

      - name: Run tests with coverage
        run: pytest --cov=topogeoml --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
