name: Documentation quickstart

on:
  pull_request:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - pyproject.toml
      - examples/circles_vs_lines.py
      - topogeoml/**
      - .github/workflows/docs-quickstart.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - pyproject.toml
      - examples/circles_vs_lines.py
      - topogeoml/**
      - .github/workflows/docs-quickstart.yml

permissions:
  contents: read

jobs:
  quickstart:
    name: README first run (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python-version }}"
      - name: Execute README commands in a fresh checkout and environment
        shell: bash
        run: |
          set -euo pipefail
          # Clone this checkout to test the PR commit, rather than remote main.
          git clone --no-hardlinks "$GITHUB_WORKSPACE" "$RUNNER_TEMP/TopoGeoML"
          cd "$RUNNER_TEMP/TopoGeoML"
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install .
          python -m pip check
          python examples/circles_vs_lines.py
      - name: Check README commands against smoke workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          workflow = Path(".github/workflows/docs-quickstart.yml").read_text(encoding="utf-8")
          required = (
              "git clone https://github.com/smaniches/TopoGeoML.git",
              "cd TopoGeoML",
              "python3 -m venv .venv",
              ". .venv/bin/activate",
              "python -m pip install .",
              "python examples/circles_vs_lines.py",
          )
          for command in required:
              assert command in text, f"README missing quickstart command: {command}"
          for command in required[2:]:
              assert command in workflow, f"CI does not exercise README command: {command}"
          PY
      - name: Check documentation structure, links, and filenames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          selected = [
              Path("README.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/DESIGN_DECISIONS.md"),
              Path("docs/LIMITATIONS.md"),
              Path("docs/USAGE.md"),
              Path("docs/README.md"),
              Path("docs/research_scope.md"),
          ]
          forbidden = re.compile(
              r"\b(?:robust|seamless|state-of-the-art|cutting-edge|powerful|elegant)\b",
              re.IGNORECASE,
          )
          for file in selected:
              content = file.read_text(encoding="utf-8")
              if forbidden.search(content):
                  raise AssertionError(f"Prohibited wording in {file}")
              for relative in re.findall(r"\[[^\]]+\]\(([^)]+)\)", content):
                  url = relative.split("#", 1)[0]
                  if not url or re.match(r"^(?:[a-z]+:|/)", url):
                      continue
                  target = file.parent / url
                  if not target.exists():
                      raise AssertionError(f"Broken documentation link: {file} -> {url}")

          expected = [
              "1. What this is and what problem it solves",
              "2. Why existing approaches fall short",
              "3. What is genuinely new and what is inherited",
              "4. Quickstart",
              "5. Where it breaks",
              "6. Technical documentation",
          ]
          readme = Path("README.md").read_text(encoding="utf-8")
          observed = re.findall(r"^## (.+)$", readme, flags=re.MULTILINE)
          if observed != expected:
              raise AssertionError(f"README heading contract changed: {observed!r}")

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()
          folded = {}
          for filename in tracked:
              key = filename.casefold()
              if key in folded and folded[key] != filename:
                  raise AssertionError(
                      f"Case-insensitive file collision: {folded[key]} vs {filename}"
                  )
              folded[key] = filename
          print("Documentation links, wording, section order and path cases OK")
          PY
