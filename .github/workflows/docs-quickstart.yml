name: Documentation quickstart

on:
  pull_request:
    paths:
      - README.md
      - docs/**
      - .github/workflows/docs-quickstart.yml
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**
      - .github/workflows/docs-quickstart.yml

permissions:
  contents: read

jobs:
  quickstart:
    name: README first run (clean Python 3.11 environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install source package in a new virtual environment
        shell: bash
        run: |
          set -euo pipefail
          python3.11 -m venv .venv
          . .venv/bin/activate
          python -m pip install -e .
      - name: Execute the Python example copied from README
        shell: bash
        run: |
          set -euo pipefail
          . .venv/bin/activate
          python - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          marker = "python - <<'PY'\n"
          if text.count(marker) != 1:
              raise AssertionError("README must contain exactly one Python here-document example")
          body = text.split(marker, 1)[1].split("\nPY\n", 1)
          if len(body) != 2:
              raise AssertionError("README Python example must end with a PY terminator")
          if not all(s in text for s in (
              "python3.11 -m venv .venv",
              ". .venv/bin/activate",
              "python -m pip install -e .",
          )):
              raise AssertionError("README installation steps drifted from the tested workflow")
          exec(compile(body[0], "README.md quickstart", "exec"), {"__name__": "__main__"})
          PY
      - name: Check documentation structure, links, and filenames
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          selected = [
              Path("README.md"),
              Path("docs/ARCHITECTURE.md"),
              Path("docs/DESIGN_DECISIONS.md"),
              Path("docs/LIMITATIONS.md"),
              Path("docs/USAGE.md"),
              Path("docs/README.md"),
              Path("docs/research_scope.md"),
          ]
          forbidden = re.compile(
              r"\b(?:robust|seamless|state-of-the-art|cutting-edge|powerful|elegant)\b",
              re.IGNORECASE,
          )
          for file in selected:
              content = file.read_text(encoding="utf-8")
              if forbidden.search(content):
                  raise AssertionError(f"Prohibited wording in {file}")
              for relative in re.findall(r"\[[^\]]+\]\(([^)]+)\)", content):
                  url = relative.split("#", 1)[0]
                  if not url or re.match(r"^(?:[a-z]+:|/)", url):
                      continue
                  target = file.parent / url
                  if not target.exists():
                      raise AssertionError(f"Broken documentation link: {file} -> {url}")

          expected = [
              "1. What this is and what problem it solves",
              "2. Why existing approaches fall short",
              "3. What is genuinely new and what is inherited",
              "4. Quickstart",
              "5. Where it breaks",
              "6. Documentation",
          ]
          readme = Path("README.md").read_text(encoding="utf-8")
          observed = re.findall(r"^## (.+)$", readme, flags=re.MULTILINE)
          if observed != expected:
              raise AssertionError(f"README heading contract changed: {observed!r}")

          tracked = subprocess.check_output(
              ["git", "ls-files"], text=True
          ).splitlines()
          folded = {}
          for filename in tracked:
              key = filename.casefold()
              if key in folded and folded[key] != filename:
                  raise AssertionError(
                      f"Case-insensitive file collision: {folded[key]} vs {filename}"
                  )
              folded[key] = filename
          print("Documentation links, wording, section order and path cases OK")
          PY
