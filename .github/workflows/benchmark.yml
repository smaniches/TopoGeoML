name: Benchmark (diff_ph)

# Triggered manually (workflow_dispatch) and automatically on PRs that touch
# the differentiable-PH layer, the benchmark framework, or this workflow file.
# The bench is CPU-only on hosted runners; rankings can flip on GPU. The report
# surfaces this caveat on every run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "topogeoml/nn/diff_ph.py"
      - "benchmarks/**"
      - ".github/workflows/benchmark.yml"

permissions:
  contents: read

jobs:
  bench:
    name: TopoGeoML diff-PH framework (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package + bench deps
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch + torchvision from the same wheel index.
          # The CPU torchvision wheel ships C++ ops (e.g.
          # ``torchvision::nms``) that are ABI-compatible with the CPU
          # torch wheel. Installing torch from the CPU index and then
          # letting ``pip install -e ".[bench]"`` pull the default-PyPI
          # torchvision (which is CUDA-built) produces a silent ABI
          # mismatch — torch loads but ``torchvision::nms`` is missing
          # at runtime, breaking every backend that imports torchvision
          # (``topogeoml-diff-ph``, ``torch-topological``). Caught on
          # PR #17's CI after the surfacing fix from PR #16/#17.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[bench]"

      - name: Run benchmark framework (smoke tier)
        # CI runs the full bench under ``--quick`` (thinned seeds/repeats)
        # so it completes within the 30-minute timeout. Full-rigor numbers
        # come from running without ``--quick`` on a longer-budget runner
        # (Modal, local). The ``config`` block in the JSON records the
        # smoke-tier so downstream consumers cannot silently confuse the
        # two regimes.
        run: |
          python -m benchmarks \
            --quick \
            --output benchmarks/leaderboard/current.json \
            --markdown bench_report.md

      - name: Upload leaderboard JSON
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-leaderboard
          path: benchmarks/leaderboard/current.json
          retention-days: 90

      - name: Upload markdown report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bench-report-markdown
          path: bench_report.md
          retention-days: 30
