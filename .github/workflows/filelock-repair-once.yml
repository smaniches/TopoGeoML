name: Prepare FileLock security release
on:
  push:
    branches: [fix/filelock-security-20261023]
    paths: [.github/workflows/filelock-repair-once.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/filelock-security-20261023
      - name: Restrict only optional PyTorch dependency paths
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import json,tomllib
          p=Path('pyproject.toml'); text=p.read_text()
          assert text.count('    "torch>=2.0",')==2
          text=text.replace('    "torch>=2.0",','    "torch>=2.0",\n    # CVE-2026-112940: 3.20.3 predates the affected SQLite lock feature.\n    # Temporary compatibility pin while PyTorch constrains FileLock below 4.\n    "filelock==3.20.3",')
          p.write_text(text)
          for name in ['topogeoml/_version.py','CITATION.cff']:
              p=Path(name); p.write_text(p.read_text().replace('0.0.9','0.0.10').replace('2026-10-15','2026-10-23'))
          p=Path('.zenodo.json'); data=json.loads(p.read_text()); data['version']='0.0.10'; p.write_text(json.dumps(data,indent=2)+'\n')
          p=Path('LIMITATIONS.md'); p.write_text(p.read_text().replace('v0.0.9','v0.0.10').replace('`0.0.9` is pre-stable','`0.0.10` is pre-stable'))
          p=Path('CHANGELOG.md'); text=p.read_text(); text=text.replace('## [Unreleased]\n','## [Unreleased]\n\n## [0.0.10] - 2026-10-23\n\n### Security\n\n- Constrain FileLock to 3.20.3 in the optional `torch` and `bench` extras. This version predates the feature affected by CVE-2026-112940 and remains compatible with the currently tested PyTorch dependency range. The default non-PyTorch installation is unchanged. Revisit the pin when PyTorch permits FileLock >=4.2.1.\n- No algorithm, numerical output, or archived experiment is changed. This dependency advisory does not establish that TopoGeoML invokes the vulnerable SQLite lock path.\n',1); p.write_text(text)
          p=Path('SECURITY.md'); text=p.read_text(); text+='\n## FileLock compatibility constraint (2026-10-23)\n\nThe optional PyTorch environments resolved FileLock 3.32.3, inside the affected range for CVE-2026-112940. The `torch` and `bench` extras now require 3.20.3, which predates the affected SQLite locking feature. This is a compatibility constraint, not a vulnerability suppression. Revisit it when upstream PyTorch permits the patched >=4.2.1 line. No reachability of the vulnerable code path from TopoGeoML was established.\n\nAdvisory: https://github.com/tox-dev/filelock/security/advisories/GHSA-v4x8-3wr5-3wq8\n'; p.write_text(text)
          parsed=tomllib.loads(Path('pyproject.toml').read_text())
          for extra in ['torch','bench']: assert 'filelock==3.20.3' in parsed['project']['optional-dependencies'][extra]
          assert not any(d.startswith('filelock') for d in parsed['project']['dependencies'])
          PY
          git add pyproject.toml topogeoml/_version.py CITATION.cff .zenodo.json LIMITATIONS.md CHANGELOG.md SECURITY.md
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -s -m 'fix(security): constrain optional FileLock and prepare 0.0.10'
          git push origin HEAD:fix/filelock-security-20261023
