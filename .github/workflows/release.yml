name: Release

# Tag-triggered only. Recover failed downstream jobs by re-running failed jobs
# in the original workflow run so its successful build artifacts are reused.
on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  # This job creates the release artifacts and their build-provenance
  # attestation. Runtime dependency resolution is deliberately kept out of
  # this OIDC-authorized job; it happens in the unprivileged `sbom` job below.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # provenance OIDC
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Assert exactly one release wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
      - name: Provenance attestation (dist)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: dist/

  # Unprivileged by design. The exact release wheel is installed into an
  # isolated runtime environment so CycloneDX observes the wheel's resolved
  # runtime dependency closure, not the release builder's tool environment.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Generate CycloneDX SBOM from exact release wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel="${wheels[0]}"
          expected_version="${GITHUB_REF_NAME#v}"

          python -m pip install --upgrade pip cyclonedx-bom
          python -m venv --without-pip .sbom-runtime
          python -m pip --python .sbom-runtime install "$wheel"

          cyclonedx-py environment .sbom-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom.cdx.json
          python scripts/bind_release_sbom.py \
            --sbom sbom.cdx.json \
            --wheel "$wheel" \
            --expected-version "$expected_version"
      - name: Independently verify SBOM root against exact wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          expected_version="${GITHUB_REF_NAME#v}"
          python scripts/bind_release_sbom.py \
            --verify-only \
            --sbom sbom.cdx.json \
            --wheel "${wheels[0]}" \
            --expected-version "$expected_version"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-sbom
          path: sbom.cdx.json

  # The only privileged SBOM step. It consumes the already-built wheel and the
  # already-verified SBOM, installs no dependencies, and executes no project
  # code. The runtime SBOM is attested to the wheel only, not to the sdist.
  attest-sbom:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # attestation OIDC
      attestations: write   # actions/attest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-sbom
          path: .
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        with:
          subject-path: "dist/*.whl"
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: "sbom.cdx.json"

  publish-pypi:
    needs: [build, sbom, attest-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # PyPI Trusted Publishing OIDC
    environment:
      name: pypi
      url: https://pypi.org/project/topogeoml/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify existing PyPI files and stage missing distributions
        id: pypi_files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MISSING_COUNT=$(python .github/scripts/verify_pypi_files.py \
            --project topogeoml \
            --version "$VERSION" \
            --dist-dir dist \
            --prepare-dir publish-dist)
          echo "missing_count=$MISSING_COUNT" >> "$GITHUB_OUTPUT"
      - name: Publish missing distributions to PyPI (Trusted Publishing, OIDC)
        if: steps.pypi_files.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: publish-dist
          print-hash: true
      - name: Verify complete PyPI release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python .github/scripts/verify_pypi_files.py \
            --project topogeoml \
            --version "$VERSION" \
            --dist-dir dist \
            --require-complete \
            --attempts 12 \
            --delay-seconds 5

  sign-and-release:
    needs: [build, sbom, attest-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Release
      id-token: write       # Sigstore signing OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-sbom
          path: .
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: |
            dist/*.tar.gz
            dist/*.whl
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3.0.2
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.cdx.json
            *.sigstore.json
