name: Release

# Exact-tag releases. workflow_dispatch is required for the GITHUB_TOKEN
# auto-tag workflow; its tag input must match its immutable ref.
# Recover partial publications by rerunning failed jobs in the original run.
on:
  push:
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag matching the dispatch ref (e.g. v0.0.8)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: topogeoml-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require an exact version tag on both entrypoints
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$REF_TYPE" == "tag" ]] || { echo "::error::release ref is not a tag"; exit 1; }
          [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::release tag must be vX.Y.Z"; exit 1;
          }
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$INPUT_TAG" != "$REF_NAME" ]]; then
            echo "::error::dispatch tag must equal the tag ref"; exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require package and changelog metadata to match the immutable ref
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' topogeoml/_version.py)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
            echo "::error::release ref disagrees with package version"; exit 1;
          }
          grep -Fq "## [$version]" CHANGELOG.md || {
            echo "::error::release ref lacks matching changelog"; exit 1;
          }

  # This job creates the release artifacts and their build-provenance
  # attestation. Runtime dependency resolution is deliberately kept out of
  # this OIDC-authorized job; it happens in the unprivileged `sbom` job below.
  build:
    needs: validate-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # provenance OIDC
      attestations: write   # actions/attest-build-provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install --upgrade pip build
      - name: Build sdist + wheel
        run: python -m build
      - name: Assert exactly one release wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
      - name: Provenance attestation (dist)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Upload dist artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-dist
          path: dist/

  # Unprivileged by design. The exact release wheel is installed into an
  # isolated runtime environment so CycloneDX observes the wheel's resolved
  # runtime dependency closure, not the release builder's tool environment.
  sbom:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Generate CycloneDX SBOM from exact release wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel="${wheels[0]}"
          expected_version="${GITHUB_REF_NAME#v}"

          python -m pip install --upgrade pip cyclonedx-bom
          python -m venv --without-pip .sbom-runtime
          python -m pip --python .sbom-runtime install "$wheel"

          cyclonedx-py environment .sbom-runtime/bin/python \
            --pyproject pyproject.toml \
            --mc-type library \
            --output-reproducible \
            --output-format JSON \
            --output-file sbom.cdx.json
          python scripts/bind_release_sbom.py \
            --sbom sbom.cdx.json \
            --wheel "$wheel" \
            --expected-version "$expected_version"
      - name: Independently verify SBOM root against exact wheel
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if (( ${#wheels[@]} != 1 )); then
            echo "::error::expected exactly one release wheel, found ${#wheels[@]}"
            exit 1
          fi
          expected_version="${GITHUB_REF_NAME#v}"
          python scripts/bind_release_sbom.py \
            --verify-only \
            --sbom sbom.cdx.json \
            --wheel "${wheels[0]}" \
            --expected-version "$expected_version"
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: release-sbom
          path: sbom.cdx.json

  # The only privileged SBOM step. It consumes the already-built wheel and the
  # already-verified SBOM, installs no dependencies, and executes no project
  # code. The runtime SBOM is attested to the wheel only, not to the sdist.
  attest-sbom:
    needs: [build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # attestation OIDC
      attestations: write   # actions/attest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-sbom
          path: .
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        env:
          NODE_OPTIONS: '--max-http-header-size=32768'
        with:
          subject-path: "dist/*.whl"
          predicate-type: "https://cyclonedx.org/bom"
          predicate-path: "sbom.cdx.json"

  publish-pypi:
    needs: [build, sbom, attest-sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # PyPI Trusted Publishing OIDC
    environment:
      name: pypi
      url: https://pypi.org/project/topogeoml/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Verify existing PyPI files and stage missing distributions
        id: pypi_files
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          MISSING_COUNT=$(python .github/scripts/verify_pypi_files.py \
            --project topogeoml \
            --version "$VERSION" \
            --dist-dir dist \
            --prepare-dir publish-dist)
          echo "missing_count=$MISSING_COUNT" >> "$GITHUB_OUTPUT"
      - name: Publish missing distributions to PyPI (Trusted Publishing, OIDC)
        if: steps.pypi_files.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
        with:
          packages-dir: publish-dist
          print-hash: true
      - name: Verify complete PyPI release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python .github/scripts/verify_pypi_files.py \
            --project topogeoml \
            --version "$VERSION" \
            --dist-dir dist \
            --require-complete \
            --attempts 12 \
            --delay-seconds 5

  sign-and-release:
    # Do not create a citable GitHub/Zenodo release if PyPI failed.
    needs: [build, sbom, attest-sbom, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Release
      id-token: write       # Sigstore signing OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: release-sbom
          path: .
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9  # v3.5.0
        with:
          inputs: |
            dist/*.tar.gz
            dist/*.whl
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          generate_release_notes: true
          files: |
            dist/*
            sbom.cdx.json
            *.sigstore.json

  # A green Release run must mean that both registries expose the exact
  # distributions produced by this run, not merely that upload steps returned.
  verify-released-artifacts:
    needs: [publish-pypi, sign-and-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-sbom
          path: .
      - name: Reconcile PyPI files to exact build hashes
        run: |
          python .github/scripts/verify_pypi_files.py \
            --project topogeoml --version "${GITHUB_REF_NAME#v}" \
            --dist-dir dist --require-complete --attempts 12 --delay-seconds 5
      - name: Reconcile GitHub Release artifacts to exact build hashes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            --jq '[.assets[] | {name: .name, digest: .digest}]')"
          RELEASE_ASSETS="$assets" python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          entries = json.loads(os.environ["RELEASE_ASSETS"])
          assets = {}
          for entry in entries:
              if entry["name"] in assets:
                  raise SystemExit(f"duplicate GitHub release asset: {entry['name']}")
              assets[entry["name"]] = entry["digest"]
          distributions = sorted(
              [*Path("dist").glob("*.whl"), *Path("dist").glob("*.tar.gz")]
          )
          if len(distributions) != 2:
              raise SystemExit("expected exactly one wheel and one sdist")
          for path in [*distributions, Path("sbom.cdx.json")]:
              digest = "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()
              if assets.get(path.name) != digest:
                  raise SystemExit(f"GitHub Release digest mismatch or missing: {path.name}")
          for path in distributions:
              bundle = path.name + ".sigstore.json"
              if bundle not in assets:
                  raise SystemExit(f"missing Sigstore bundle: {bundle}")
          print("GitHub Release assets match the exact built distributions and SBOM")
          PY
