version: 2
updates:
  # pyproject.toml declares compatibility floors, not pinned runtime versions.
  # Routine version updates would only ratchet those minima upward even though
  # fresh installs already resolve newer compatible releases. Keep automated
  # security updates enabled, but do not open routine Python version-update PRs.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0

  # GitHub Actions are SHA-pinned, so routine updates replace an exact executable
  # revision and are useful maintenance rather than compatibility-floor churn.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions-maintenance:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
