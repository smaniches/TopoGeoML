version: 2
updates:
  # Scientific library dependencies. Keep declared lower bounds intentional:
  # routine minor/patch maintenance is grouped by compatibility domain, while
  # major upgrades remain standalone and require explicit review.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      core-runtime:
        patterns:
          - "numpy"
          - "scipy"
          - "scikit-learn"
          - "ripser"
          - "networkx"
          - "pyyaml"
        update-types:
          - "minor"
          - "patch"
      optional-scientific:
        patterns:
          - "torch"
          - "torch-geometric"
          - "torch-topological"
          - "torchvision"
          - "toponetx"
          - "gudhi"
        update-types:
          - "minor"
          - "patch"
      development-tooling:
        patterns:
          - "pytest"
          - "pytest-cov"
          - "pytest-benchmark"
          - "ruff"
          - "mypy"
          - "hypothesis"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions are SHA-pinned. Update monthly; major action revisions remain
  # standalone so their runtime and permission changes are reviewed explicitly.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    groups:
      github-actions-maintenance:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
